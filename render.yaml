services:
  - type: web
    name: cvjachai-api
    runtime: docker
    plan: free
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cvjachai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: API_KEY
        sync: false
      - key: PORT
        value: 8000

databases:
  - name: cvjachai-db
    plan: free
